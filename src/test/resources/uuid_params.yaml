openapi: 3.0.3
info:
  title: UUID parameters
  version: 1.0.0
# format: uuid in path, query and header parameters (single, optional, nullable and arrays) and in form fields. No
# schema has a uuid, so only the parameters make the crate depend on uuid.
paths:
  /items/{id}/{ids}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ids
          in: path
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: owner
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: parent
          in: query
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          required: true
          schema:
            type: string
            format: uuid
            nullable: true
        - name: tags
          in: query
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: tagsCsv
          in: query
          explode: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Trace-Id
          in: header
          schema:
            type: string
            format: uuid
        - name: X-Span-Ids
          in: header
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        '204':
          description: Nothing
  /form:
    post:
      operationId: postForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                parent:
                  type: string
                  format: uuid
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Nothing
  /upload:
    post:
      operationId: postUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                parent:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Nothing
