    - a list item

      with a continuation paragraph

          code inside the item
paths:
  /x:
    get:
      operationId: getX
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Holder"}
components:
  schemas:
    Holder:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
            enum: [red, green]
        required_labels:
          type: object
          additionalProperties:
            type: string
            enum: [high, low]
        array_labels:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [up, down]
        label_maps:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
              enum: [left, right]
      required: [required_labels]
