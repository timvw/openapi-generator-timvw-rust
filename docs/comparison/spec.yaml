openapi: 3.0.3
# A small chat API in the shape of the OpenAI spec, written to show how Rust generators differ on the
# constructs genai-rs clients depend on: tagged and untagged unions, string enums, nullable and optional
# fields, integers with and without a format, maps, recursive schemas, inline objects, multipart uploads,
# server-sent events and query parameters. See docs/comparison/README.md.
info:
  title: Comparison API
  version: 1.0.0
  description: |
    A chat API used to compare Rust client generators. Docs live at https://example.com/docs.
servers:
  - url: https://api.example.com/v1
paths:
  /models:
    get:
      operationId: listModels
      summary: List models
      description: Lists the models, newest first. See https://example.com/docs/models.
      parameters:
        - name: limit
          in: query
          description: How many models to return.
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: after
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        default:
          $ref: '#/components/responses/Error'
  /models/{model_id}:
    get:
      operationId: retrieveModel
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default:
          $ref: '#/components/responses/Error'
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
      responses:
        '200':
          description: The completion, or a stream of chunks when `stream` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatCompletionChunk'
        default:
          $ref: '#/components/responses/Error'
  /files:
    post:
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '200':
          description: The uploaded file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        default:
          $ref: '#/components/responses/Error'
  /threads/{thread_id}:
    get:
      operationId: getThread
      parameters:
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The thread with its replies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadNode'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
              nullable: true
    Model:
      type: object
      description: A model. See https://example.com/docs/models for the list.
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model]
        created:
          type: integer
          description: Unix timestamp (seconds).
        owned_by:
          type: string
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    Role:
      type: string
      enum: [system, user, assistant]
    CreateChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: ID of the model to use.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
          nullable: true
          description: No format, so the generator picks the width.
        seed:
          type: integer
          format: int64
        n:
          type: integer
          format: int32
        stream:
          type: boolean
          default: false
        stop:
          description: Up to 4 sequences where generation stops.
          nullable: true
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        response_format:
          $ref: '#/components/schemas/ResponseFormat'
        legacy_user:
          type: string
          deprecated: true
    Message:
      description: A message, told apart by `role`.
      oneOf:
        - $ref: '#/components/schemas/SystemMessage'
        - $ref: '#/components/schemas/UserMessage'
        - $ref: '#/components/schemas/AssistantMessage'
      discriminator:
        propertyName: role
        mapping:
          system: '#/components/schemas/SystemMessage'
          user: '#/components/schemas/UserMessage'
          assistant: '#/components/schemas/AssistantMessage'
    SystemMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system]
        content:
          type: string
    UserMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user]
        content:
          description: Text, or an array of parts.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
        name:
          type: string
    AssistantMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [assistant]
        content:
          type: string
          nullable: true
        refusal:
          type: string
          nullable: true
    ContentPart:
      description: A part of a user message. No discriminator, but every branch has a fixed `type`.
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/ImagePart'
    TextPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
    ImagePart:
      type: object
      required: [type, image_url]
      properties:
        type:
          type: string
          enum: [image_url]
        image_url:
          type: object
          required: [url]
          properties:
            url:
              type: string
            detail:
              type: string
              enum: [auto, low, high]
    ResponseFormat:
      oneOf:
        - type: object
          title: Text
          required: [type]
          properties:
            type:
              type: string
              enum: [text]
        - type: object
          title: JsonSchema
          required: [type, json_schema]
          properties:
            type:
              type: string
              enum: [json_schema]
            json_schema:
              type: object
              additionalProperties: true
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/AssistantMessage'
              finish_reason:
                $ref: '#/components/schemas/FinishReason'
        usage:
          $ref: '#/components/schemas/Usage'
    FinishReason:
      type: string
      enum: [stop, length, tool_calls]
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    ChatCompletionChunk:
      type: object
      required: [id, object, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion.chunk]
        choices:
          type: array
          items:
            type: object
            required: [index, delta]
            properties:
              index:
                type: integer
              delta:
                type: object
                properties:
                  content:
                    type: string
                    nullable: true
              finish_reason:
                allOf:
                  - $ref: '#/components/schemas/FinishReason'
                nullable: true
    UploadFileRequest:
      type: object
      required: [file, purpose]
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
          enum: [assistants, batch, fine-tune]
    FileObject:
      type: object
      required: [id, bytes, filename, purpose]
      properties:
        id:
          type: string
        bytes:
          type: integer
        filename:
          type: string
        purpose:
          type: string
    ThreadNode:
      description: A recursive schema; only the edges on a cycle need a `Box`.
      type: object
      required: [id, replies]
      properties:
        id:
          type: string
        author:
          $ref: '#/components/schemas/Author'
        parent:
          $ref: '#/components/schemas/ThreadNode'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/ThreadNode'
    Author:
      type: object
      required: [name]
      properties:
        name:
          type: string
