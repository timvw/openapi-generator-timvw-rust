openapi: 3.1.0
info:
  title: Nullable items
  version: "1"
paths:
  /holder:
    get:
      operationId: getHolder
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Holder"}
components:
  schemas:
    Thing:
      type: object
      properties:
        name: {type: string}
    Holder:
      type: object
      properties:
        map: {type: object, additionalProperties: {type: [string, "null"]}}
        list: {type: array, items: {oneOf: [{type: integer}, {type: "null"}]}}
        things: {type: array, items: {anyOf: [{$ref: "#/components/schemas/Thing"}, {type: "null"}]}}
        grid:
          type: object
          additionalProperties:
            type: array
            items: {type: [string, "null"]}
        modes: {type: array, items: {type: [string, "null"], enum: [fast, slow, null]}}
