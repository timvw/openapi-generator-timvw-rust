name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/timvw/openapi-generator-timvw-rust

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Writes ~/.m2/settings.xml with a <server id="central"> entry fed from the env vars below.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$version" -DgenerateBackupPoms=false

      - name: Deploy
        run: ./mvnw -B --no-transfer-progress -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: generator-jar
          path: target/openapi-generator-timvw-rust-${{ env.VERSION }}.jar
          if-no-files-found: error

  docker:
    name: Push Docker image (openapi-generator ${{ matrix.openapi-generator }})
    needs: maven-central
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One image per openapi-generator version a client repo pins; the default
        # (7.25.0) also gets the plain <version> and latest tags.
        openapi-generator: ["7.15.0", "7.25.0"]
        include:
          - openapi-generator: "7.25.0"
            default: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Compile the generator against the same openapi-generator version the image bundles.
      - name: Build jar against openapi-generator ${{ matrix.openapi-generator }}
        run: |
          ./mvnw -B --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress -Dopenapi-generator.version="${{ matrix.openapi-generator }}" -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        run: |
          tags="${IMAGE}:${VERSION}-og${{ matrix.openapi-generator }}"
          if [ "${{ matrix.default }}" = "true" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "TAGS<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENAPI_GENERATOR_VERSION=${{ matrix.openapi-generator }}
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
