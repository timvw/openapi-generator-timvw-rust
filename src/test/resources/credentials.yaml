openapi: 3.0.3
info:
  title: Credentials
  version: 1.0.0
# One operation per security scheme: bearer, basic, an api key in a header, in a query parameter and in a cookie, and
# oauth2. What each sends is in src/test/rust/credentials.rs.
paths:
  /bearer:
    get:
      operationId: withBearer
      security:
        - bearer: []
      responses:
        '204':
          description: Nothing
  /basic:
    get:
      operationId: withBasic
      security:
        - basic: []
      responses:
        '204':
          description: Nothing
  /header-key:
    get:
      operationId: withHeaderKey
      security:
        - headerKey: []
      responses:
        '204':
          description: Nothing
  /query-key:
    get:
      operationId: withQueryKey
      security:
        - queryKey: []
      responses:
        '204':
          description: Nothing
  /cookie-key:
    get:
      operationId: withCookieKey
      security:
        - cookieKey: []
      responses:
        '204':
          description: Nothing
  /oauth:
    get:
      operationId: withOauth
      security:
        - oauth: []
      responses:
        '204':
          description: Nothing
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
    headerKey:
      type: apiKey
      in: header
      name: X-Api-Key
    queryKey:
      type: apiKey
      in: query
      name: api_key
    cookieKey:
      type: apiKey
      in: cookie
      name: api_token
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/token
          scopes: {}
