openapi: 3.0.3
info:
  title: Server
  description: The server target (targets), answered by the client generated from the same spec.
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      summary: Lists the pets.
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: How many pets to return.
          schema:
            type: integer
            format: int32
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/Kind'
        - name: tags
          in: query
          description: Repeated, one pair per tag.
          schema:
            type: array
            items:
              type: string
        - name: ids
          in: query
          description: Comma-separated.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
        - name: X-Trace
          in: header
          schema:
            type: string
      responses:
        "200":
          description: the pets
          headers:
            X-Total:
              schema:
                type: integer
            X-Kinds:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kind'
            X-Next:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        "4XX":
          description: a client error
          headers:
            X-Reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createPet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "409":
          description: a pet with that name exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
        - name: verbose
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updatePet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      operationId: deletePet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
        "404":
          description: no such pet
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                width:
                  type: integer
                tags:
                  type: array
                  items:
                    type: string
                extras:
                  type: array
                  items:
                    type: string
                    format: binary
                owner:
                  $ref: '#/components/schemas/NewPet'
      responses:
        "200":
          description: what the server received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
    put:
      operationId: putPhoto
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: stored
    get:
      operationId: getPhoto
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the photo
          headers:
            X-Photo-Size:
              schema:
                type: integer
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: no photo
          content:
            text/plain:
              schema:
                type: string
  /pets/{petId}/name:
    get:
      operationId: getPetName
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the pet's name
          content:
            text/plain:
              schema:
                type: string
    put:
      operationId: renamePet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "204":
          description: renamed
  /pets/feed:
    get:
      operationId: petFeed
      tags: [Pets]
      responses:
        "200":
          description: the pets, as a list or as a stream
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/search:
    post:
      operationId: searchPets
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                limit:
                  type: integer
                kinds:
                  type: array
                  items:
                    $ref: '#/components/schemas/Kind'
                ids:
                  type: array
                  items:
                    type: integer
            encoding:
              ids:
                style: form
                explode: false
      responses:
        "200":
          description: the pets found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pets/import:
    post:
      operationId: importPet
      tags: [Pets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
          application/sdp:
            schema:
              type: string
      responses:
        "200":
          description: what was imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imported'
  /pets/{petId}/answer:
    post:
      operationId: answerPet
      tags: [Pets]
      description: an SDP offer in, an SDP answer out (a string of a media type that is neither JSON nor text)
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/sdp:
            schema:
              type: string
      responses:
        "201":
          description: the SDP answer
          content:
            application/sdp:
              schema:
                type: string
  /pets/filter:
    get:
      operationId: filterPets
      tags: [Pets]
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              name:
                type: string
      responses:
        "204":
          description: filtered
  /pets/{petId}.json:
    get:
      operationId: getPetJson
      tags: [Pets]
      description: a path parameter that is not a whole path segment, which the server leaves out
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}/events:
    get:
      operationId: petEvents
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: what happened to the pet, as events named by their type
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PetEvent'
  /owners/{ownerName}/pets/{petName}:
    get:
      operationId: getOwnerPet
      tags: [Owners]
      parameters:
        - name: ownerName
          in: path
          required: true
          schema:
            type: string
        - name: petName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /owners/events:
    get:
      operationId: ownerEvents
      tags: [Owners]
      responses:
        "200":
          description: a stream of pets
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Kind:
      type: string
      enum: [cat, dog]
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: '#/components/schemas/Kind'
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/Kind'
    Photo:
      type: object
      required: [fileName, size]
      properties:
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        caption:
          type: string
        width:
          type: integer
        tags:
          type: array
          items:
            type: string
        extras:
          type: integer
        owner:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Imported:
      type: object
      required: [via, detail]
      properties:
        via:
          type: string
        detail:
          type: string
    PetEvent:
      oneOf:
        - $ref: '#/components/schemas/PetBorn'
        - $ref: '#/components/schemas/PetRenamed'
      discriminator:
        propertyName: type
        mapping:
          pet.born: '#/components/schemas/PetBorn'
          pet.renamed: '#/components/schemas/PetRenamed'
    PetBorn:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [pet.born]
        name:
          type: string
    PetRenamed:
      type: object
      required: [type, from, to]
      properties:
        type:
          type: string
          enum: [pet.renamed]
        from:
          type: string
        to:
          type: string
