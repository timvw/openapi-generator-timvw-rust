openapi: 3.0.3
info:
  title: Response functions
  version: 1.0.0
paths:
  /items/{id}:
    get:
      operationId: getItem
      tags: [Items]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the item
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        "404":
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteItem
      tags: [Items]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
  /items:
    get:
      operationId: listItems
      tags: [Items]
      responses:
        "200":
          description: the items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /version:
    get:
      operationId: getVersion
      tags: [Items]
      responses:
        "200":
          description: the version
          content:
            text/plain:
              schema:
                type: string
  /download:
    get:
      operationId: download
      tags: [Items]
      responses:
        "200":
          description: a file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        owner:
          $ref: '#/components/schemas/Owner'
    Owner:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Problem:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
