openapi: 3.1.0
info:
  title: A schema with the name of the helper module
  version: 1.0.0
paths: {}
components:
  schemas:
    UnionDispatch:
      type: object
      properties:
        name:
          type: string
    Tagged:
      oneOf:
        - $ref: '#/components/schemas/One'
        - $ref: '#/components/schemas/Two'
      discriminator:
        propertyName: type
    One:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [one]
    Two:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [two]
