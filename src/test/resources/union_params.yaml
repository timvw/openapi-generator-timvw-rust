openapi: 3.0.3
info:
  title: Union parameters
  version: 1.0.0
# Parameters whose type is a oneOf union, as openai-client-base's VaultStatusFilterParam (a status, or an array of
# them): a scalar variant goes out as its plain text, any other as its JSON.
paths:
  /vaults/{status}:
    get:
      operationId: listVaults
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StatusFilter'
        - name: filter
          in: query
          schema:
            $ref: '#/components/schemas/StatusFilter'
        - name: mixed
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Mixed'
        - name: filters
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StatusFilter'
        - name: X-Status
          in: header
          schema:
            $ref: '#/components/schemas/StatusFilter'
      responses:
        '204':
          description: Nothing
components:
  schemas:
    Status:
      type: string
      enum: [active, archived]
    StatusFilter:
      oneOf:
        - $ref: '#/components/schemas/Status'
        - type: array
          items:
            $ref: '#/components/schemas/Status'
    Mixed:
      oneOf:
        - type: integer
        - type: boolean
        - $ref: '#/components/schemas/Point'
    Point:
      type: object
      required: [x]
      properties:
        x:
          type: integer
