openapi: 3.0.3
info:
  title: Server
  description: The server target (targets), answered by the client generated from the same spec.
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      summary: Lists the pets.
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: How many pets to return.
          schema:
            type: integer
            format: int32
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/Kind'
        - name: tags
          in: query
          description: Repeated, one pair per tag.
          schema:
            type: array
            items:
              type: string
        - name: ids
          in: query
          description: Comma-separated.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
        - name: X-Trace
          in: header
          schema:
            type: string
      responses:
        "200":
          description: the pets
          headers:
            X-Total:
              schema:
                type: integer
            X-Kinds:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kind'
            X-Next:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        "4XX":
          description: a client error
          headers:
            X-Reason:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createPet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "409":
          description: a pet with that name exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
        - name: verbose
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updatePet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      operationId: deletePet
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
        "404":
          description: no such pet
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "204":
          description: uploaded
  /owners/{ownerName}/pets/{petName}:
    get:
      operationId: getOwnerPet
      tags: [Owners]
      parameters:
        - name: ownerName
          in: path
          required: true
          schema:
            type: string
        - name: petName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /owners/events:
    get:
      operationId: ownerEvents
      tags: [Owners]
      responses:
        "200":
          description: a stream of pets
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Kind:
      type: string
      enum: [cat, dog]
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: '#/components/schemas/Kind'
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/Kind'
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
