openapi: 3.1.0
info:
  title: Request bodies
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /item:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        "204":
          description: created
    put:
      operationId: updateItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        "204":
          description: updated
  /items:
    post:
      operationId: createItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Item'
      responses:
        "204":
          description: created
  /labels:
    post:
      operationId: setLabels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "204":
          description: set
  /anything:
    post:
      operationId: sendAnything
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "204":
          description: sent
  /count:
    post:
      operationId: setCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
              format: int64
      responses:
        "204":
          description: set
  /name:
    post:
      operationId: setName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "204":
          description: set
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: uploaded
  /counts:
    post:
      operationId: setCounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
      responses:
        "204":
          description: sent
  /shape:
    post:
      operationId: sendShape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shape'
      responses:
        "204":
          description: sent
  /maybe-item:
    post:
      operationId: sendMaybeItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Item'
                - type: 'null'
      responses:
        "204":
          description: sent
  /when:
    post:
      operationId: setWhen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date-time
      responses:
        "204":
          description: sent
  /day:
    post:
      operationId: setDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: date
      responses:
        "204":
          description: sent
  /color:
    post:
      operationId: setColor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Color'
      responses:
        "204":
          description: sent
  /blob:
    post:
      operationId: setBlob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: byte
      responses:
        "204":
          description: sent
webhooks:
  item_created:
    post:
      tags: [Hooks]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        "200":
          description: received
components:
  schemas:
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Item'
        - $ref: '#/components/schemas/Box'
    Box:
      type: object
      required: [side]
      properties:
        side:
          type: integer
          format: int64
    Color:
      type: string
      enum: [red, green]
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
