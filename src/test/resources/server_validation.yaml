openapi: 3.0.3
info:
  title: Server validation
  description: >-
    serverValidation: the server checks the validation keywords of the parameters, the form fields and the body's
    models before calling the implementation.
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      tags: [Items]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 2
            items:
              type: string
              minLength: 2
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      operationId: createItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /items/{code}:
    get:
      operationId: getItem
      tags: [Items]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /search:
    post:
      operationId: searchItems
      tags: [Items]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 5
                page:
                  type: integer
                  format: int32
                  minimum: 1
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /import:
    post:
      operationId: importItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 10
      responses:
        '201':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /notes:
    post:
      operationId: postNote
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
          text/plain:
            schema:
              type: string
      responses:
        '204':
          description: Only the JSON body has something to check.
  /health:
    get:
      operationId: health
      tags: [Items]
      responses:
        '204':
          description: Nothing to check.
components:
  schemas:
    NewItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10
        tags:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Tag'
    Tag:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 5
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
