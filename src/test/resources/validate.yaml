openapi: 3.0.3
info:
  title: validate
  version: 1.0.0
paths:
  /requests:
    post:
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
components:
  schemas:
    Request:
      type: object
      required: [messages, count]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/Message'
        count:
          type: integer
          minimum: 1
          maximum: 100
          exclusiveMaximum: true
          multipleOf: 5
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.1
        ratio:
          type: number
          format: float
          maximum: 0.1
        half:
          type: integer
          format: int32
          minimum: 0.5
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 5
        points:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Point'
        metadata:
          type: object
          minProperties: 1
          maxProperties: 2
          additionalProperties:
            type: string
            maxLength: 3
        stops:
          type: array
          items:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        content:
          $ref: '#/components/schemas/Content'
        shape:
          $ref: '#/components/schemas/Shape'
        node:
          $ref: '#/components/schemas/Node'
        validate:
          type: string
          minLength: 2
        lookahead:
          type: string
          pattern: '^(?=a)a+$'
        payload: {}
        colors:
          type: array
          minItems: 1
          items:
            type: string
            enum: [red, green]
        holder:
          $ref: '#/components/schemas/Holder'
        clash:
          $ref: '#/components/schemas/Validate'
        error:
          $ref: '#/components/schemas/ValidationError'
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          pattern: '^[a-z]+\d*$'
    Point:
      type: object
      required: [x]
      properties:
        x:
          type: number
    Content:
      oneOf:
        - type: string
          maxLength: 4
        - type: array
          items:
            $ref: '#/components/schemas/Message'
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: kind
    Circle:
      type: object
      required: [kind, radius]
      properties:
        kind:
          type: string
          enum: [Circle]
        radius:
          type: number
          minimum: 0
          exclusiveMinimum: true
    Square:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [Square]
        side:
          type: integer
    Node:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next:
          $ref: '#/components/schemas/Node'
    Holder:
      description: holds a model without constraints of its own
      type: object
      properties:
        inner:
          $ref: '#/components/schemas/Message'
        plain:
          $ref: '#/components/schemas/Point'
    Validate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
    ValidationError:
      type: object
      properties:
        code:
          type: integer
          maximum: 10
