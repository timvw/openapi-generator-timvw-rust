name: Release runtime

# release-plz for the timvw-rust-runtime crate in runtime/: on every push to main it opens (or updates) a release PR
# when runtime/ changed; publishing to crates.io is an explicit workflow_dispatch with release_action=publish, after
# the release PR is merged. Tags are timvw-rust-runtime-v<version>, which the generator's release (v*) ignores.
#
# Secrets: CARGO_REGISTRY_TOKEN (crates.io, scoped to timvw-rust-runtime). BOT_APP_ID and BOT_PRIVATE_KEY (a GitHub
# App) are optional: with them the release PR triggers CI; without them release-plz uses GITHUB_TOKEN.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
    paths: ["runtime/**"]
  workflow_dispatch:
    inputs:
      release_action:
        description: Prepare a release PR or publish an already prepared release
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - publish

env:
  HAS_APP: ${{ secrets.BOT_APP_ID != '' }}

jobs:
  release-pr:
    name: Prepare release PR
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.release_action == 'prepare')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
          manifest_path: runtime/Cargo.toml
          config: runtime/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Create GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Run release-plz release
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
          manifest_path: runtime/Cargo.toml
          config: runtime/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
