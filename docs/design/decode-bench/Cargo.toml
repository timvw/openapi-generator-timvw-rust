[package]
name = "decode-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Measures what decoding a response costs with the generated types, and what decoding only a subset, borrowing from
# the body, or leaving heavy fields as raw JSON would save. See ../partial-decoding-and-ownership.md.

[dependencies]
openai-client-base = "=0.26.0"
langfuse-client-base = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
debug = false

[workspace]
