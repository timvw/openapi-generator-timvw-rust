openapi: 3.0.3
info:
  title: Nullable items
  version: "1"
paths:
  /holder:
    get:
      operationId: getHolder
      parameters:
        - {name: ids, in: query, schema: {type: array, items: {type: string, nullable: true}}}
      responses:
        "200":
          description: a map of nullable values
          content:
            application/json:
              schema: {type: object, additionalProperties: {type: integer, nullable: true}}
    post:
      operationId: postHolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {$ref: "#/components/schemas/Thing"}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Holder"}
  /form:
    post:
      operationId: postForm
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                tags: {type: array, items: {type: string, nullable: true}}
                files: {type: array, items: {type: string, format: binary, nullable: true}}
      responses:
        "204": {description: ok}
    put:
      operationId: putForm
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tags: {type: array, items: {type: string, nullable: true}}
      responses:
        "204": {description: ok}
components:
  schemas:
    Thing:
      type: object
      nullable: true
      properties:
        name: {type: string, minLength: 2}
    Holder:
      type: object
      properties:
        map: {type: object, additionalProperties: {type: string, nullable: true}}
        list: {type: array, minItems: 1, items: {type: integer, nullable: true, minimum: 2}}
        things: {type: array, items: {$ref: "#/components/schemas/Thing"}}
        grid:
          type: object
          additionalProperties:
            type: array
            nullable: true
            items: {type: string, nullable: true, minLength: 2}
        rows:
          type: array
          items:
            type: array
            items: {type: number, nullable: true}
        modes: {type: array, items: {type: string, enum: [fast, slow], nullable: true}}
        mode_grid:
          type: object
          additionalProperties:
            type: array
            items: {type: string, enum: [up, down], nullable: true}
        plain: {type: array, items: {type: string}}
        free: {type: object, additionalProperties: {nullable: true}}
        wrapped: {type: array, items: {allOf: [{$ref: "#/components/schemas/Thing"}]}}
        uni: {$ref: "#/components/schemas/Uni"}
        lone: {$ref: "#/components/schemas/Lone"}
        free_list: {type: array, items: {type: object, nullable: true}}
    Uni:
      oneOf:
        - {type: array, items: {type: string}}
        - {type: array, items: {type: string, nullable: true}}
    Lone:
      oneOf:
        - {type: array, items: {type: string, nullable: true}}
        - {type: string}
