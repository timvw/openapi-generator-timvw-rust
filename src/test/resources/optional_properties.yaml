# OptionalPropertiesTest: properties a spec marks required that the API omits, made optional by optionalProperties.
openapi: 3.1.0
info:
  title: Optional properties
  version: 1.0.0
paths:
  /replies:
    get:
      operationId: getReply
      responses:
        "200":
          description: The reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reply"
components:
  schemas:
    # A required property declared on the schema itself.
    OutputText:
      type: object
      required: [text, logprobs]
      properties:
        text:
          type: string
        logprobs:
          type: array
          items:
            type: number
    UsageBase:
      type: object
      required: [input_tokens]
      properties:
        input_tokens:
          type: integer
    # A required property contributed by an allOf part.
    Usage:
      allOf:
        - $ref: "#/components/schemas/UsageBase"
        - type: object
          required: [cached_tokens, cache_write_tokens]
          properties:
            cached_tokens:
              type: integer
            cache_write_tokens:
              type: integer
    Reply:
      type: object
      required: [id, output, usage, access_programs]
      properties:
        id:
          type: string
        output:
          $ref: "#/components/schemas/OutputText"
        usage:
          $ref: "#/components/schemas/Usage"
        response_usage:
          $ref: "#/components/schemas/ResponseUsage"
        # Required and nullable.
        access_programs:
          type: [array, "null"]
          items:
            type: string
    TokenTotals:
      type: object
      required: [total, cached]
      properties:
        total:
          type: integer
        cached:
          type: integer
    # Required properties of objects nested under component properties (Schema.prop1.prop2 entries).
    ResponseUsage:
      type: object
      required: [input_tokens, input_tokens_details, output_tokens_details, totals]
      properties:
        input_tokens:
          type: integer
        # An inline object.
        input_tokens_details:
          type: object
          required: [cached_tokens, cache_write_tokens]
          properties:
            cached_tokens:
              type: integer
            cache_write_tokens:
              type: integer
        # A nullable wrapper of an inline object.
        output_tokens_details:
          anyOf:
            - type: object
              required: [reasoning_tokens, audio_tokens]
              properties:
                reasoning_tokens:
                  type: integer
                audio_tokens:
                  type: integer
            - type: "null"
        # A $ref to a component.
        totals:
          $ref: "#/components/schemas/TokenTotals"
        tags:
          type: array
          items:
            type: string
