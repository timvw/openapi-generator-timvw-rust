name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, generate petstore (openapi-generator ${{ matrix.openapi-generator }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version a client repo pins: openai-client-base and langfuse-client-base use 7.27.0. Keep the pom's
        # default version (the one the release's Maven deploy builds with) in this list: `verify` runs the tests, so
        # a dependency bump that changes what the generator renders fails here (this replaces a separate
        # pom-default job that ran the same tests a second time).
        openapi-generator: ["7.27.0"]
    env:
      OPENAPI_GENERATOR_VERSION: ${{ matrix.openapi-generator }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: dtolnay/rust-toolchain@stable

      # The tests build the generated crates with one shared CARGO_TARGET_DIR (target/cargo-target, see pom.xml):
      # caching it keeps their dependencies compiled between runs.
      - uses: Swatinem/rust-cache@v2
        with:
          key: maven-tests
          workspaces: runtime
          cache-directories: target/cargo-target

      - name: Maven verify
        run: ./mvnw -B --no-transfer-progress -Dopenapi-generator.version="$OPENAPI_GENERATOR_VERSION" verify

      - name: Download stock CLI jar
        run: |
          url="https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${OPENAPI_GENERATOR_VERSION}/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar"
          curl -fsSL -o "target/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar" "$url"
          echo "$(curl -fsSL "${url}.sha1")  target/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar" | sha1sum -c -

      - name: Generator is listed
        run: |
          # Java only expands a bare "dir/*" on the classpath, so resolve the plugin jar
          # ourselves and skip the -sources/-javadoc jars that sit next to it.
          jar=
          for f in target/openapi-generator-timvw-rust-*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) ;; *) jar="$f" ;; esac
          done
          test -n "$jar"
          java -cp "$jar:target/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar" \
            org.openapitools.codegen.OpenAPIGenerator list | grep -qx '    - timvw-rust'

      - name: Docker build
        run: docker build --build-arg OPENAPI_GENERATOR_VERSION="$OPENAPI_GENERATOR_VERSION" -t timvw-rust:ci .

      - name: Generate petstore (httpStack tower and reqwest-middleware)
        run: |
          # The tower client builds against this commit's runtime (runtime/), not the released one.
          for stack in tower reqwest-middleware; do
            docker run --rm -v "$PWD:/local" -u "$(id -u):$(id -g)" timvw-rust:ci generate \
              -g timvw-rust \
              -i /local/test-specs/petstore.yaml \
              -o "/local/target/petstore-$stack" \
              --additional-properties=packageName=petstore,httpStack=$stack,runtimePath=../../runtime
          done

      - name: cargo build generated petstore
        env:
          CARGO_TARGET_DIR: target/cargo-target
        run: |
          cargo build --manifest-path target/petstore-tower/Cargo.toml
          cargo build --manifest-path target/petstore-reqwest-middleware/Cargo.toml

  runtime:
    name: timvw-rust-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - uses: taiki-e/install-action@cargo-hack

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

      - name: Every feature on its own
        run: cargo hack check --each-feature --no-dev-deps

      - name: Package
        run: cargo publish --dry-run
